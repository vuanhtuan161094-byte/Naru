name: Naru external asset library
on:
  push:
    branches: [integration/one-game]
    paths:
      - 'art/external/NARU_ASSET_SOURCES.json'
      - '.github/workflows/external-asset-library.yml'
      - 'art/external/build_review.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect pinned reusable media; do not execute external code
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, stat, urllib.request, zipfile, collections
          manifest=json.loads(pathlib.Path('art/external/NARU_ASSET_SOURCES.json').read_text())
          output=pathlib.Path('external-library')
          output.mkdir(exist_ok=True)
          shutil.copy('art/external/NARU_ASSET_SOURCES.json',output/'NARU_ASSET_SOURCES.json')
          media={'.png','.webp','.jpg','.jpeg','.gif','.svg','.ase','.aseprite','.wav','.ogg','.mp3','.flac','.bmp','.tga'}
          metadata={'.json','.atlas','.tres','.txt','.md','.asset','.meta','.tsx','.tmx'}
          reports=[]
          for source in manifest['sources']:
              if source['class']!='COLLECT': continue
              name=source['repo'].replace('/','__')
              dest=output/name
              dest.mkdir(exist_ok=True)
              url='https://codeload.github.com/'+source['repo']+'/zip/'+source['ref']
              temp=pathlib.Path('/tmp')/(name+'.zip')
              req=urllib.request.Request(url,headers={'User-Agent':'Naru-Asset-Library/1.0'})
              with urllib.request.urlopen(req,timeout=120) as response,temp.open('wb') as handle:
                  shutil.copyfileobj(response,handle)
              digest=hashlib.file_digest(temp.open('rb'),'sha256').hexdigest()
              counts=collections.Counter()
              index=[]
              with zipfile.ZipFile(temp) as archive:
                  for info in archive.infolist():
                      parts=pathlib.PurePosixPath(info.filename).parts
                      if len(parts)<2 or info.is_dir() or '..' in parts or info.filename.startswith('/') or stat.S_ISLNK(info.external_attr>>16): continue
                      relative=pathlib.PurePosixPath(*parts[1:])
                      suffix=relative.suffix.lower()
                      legal=(len(relative.parts)==1 and relative.name.lower().startswith(('license','licence','notice','credits','readme','authors')))
                      selected=(not source['folders'] or any(str(relative).startswith(p) for p in source['folders']))
                      if not legal and not (selected and suffix in media|metadata): continue
                      target=dest.joinpath(*relative.parts)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with archive.open(info) as origin,target.open('wb') as result:
                          shutil.copyfileobj(origin,result)
                      counts[suffix]+=1
                      if suffix in media:
                          index.append({'path':str(relative),'bytes':target.stat().st_size,'sha256':hashlib.file_digest(target.open('rb'),'sha256').hexdigest()})
              (dest/'MEDIA_INDEX.json').write_text(json.dumps(index,indent=2,ensure_ascii=False),encoding='utf-8')
              reports.append({'source':source['repo'],'ref':source['ref'],'source_archive_sha256':digest,'media_files':len(index),'media_bytes':sum(x['bytes'] for x in index),'extensions':dict(counts),'runtime_status':'UNREVIEWED_SOURCE'})
              temp.unlink()
              print('NARU_ASSET_SOURCE',source['repo'],len(index),flush=True)
              if not index: raise RuntimeError('No media collected from '+source['repo'])
          (output/'COLLECTION_REPORT.json').write_text(json.dumps(reports,indent=2),encoding='utf-8')
          print('NARU_ASSET_LIBRARY_COLLECTED',sum(x['media_files'] for x in reports),flush=True)
          PY
      - name: Build duplicate index and contact sheets
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 art/external/build_review.py external-library external-review
      - uses: actions/upload-artifact@v4
        with:
          name: NARU-EXTERNAL-ASSET-REVIEW
          path: external-review/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NARU-EXTERNAL-ASSET-LIBRARY
          path: external-library/
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
