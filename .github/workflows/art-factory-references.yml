name: R16 reproduce original art reference library
on:
  push:
    branches: [art/r16-character-factory]
    paths:
      - 'tools/build_factory_references.py'
      - 'art/factory/references/source/**'
      - '.github/workflows/art-factory-references.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact source PNGs and regenerate previews
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 tools/build_factory_references.py
          python3 tools/validate_factory_overlay.py art/factory/references/source/NIN-002.json --out art/factory/references/generated/Sasuke_V3_TECHNICAL_QA.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: NARU-R16-ORIGINAL-REFERENCE-LIBRARY
          path: art/factory/references/
          retention-days: 30
      - name: Commit reproducible references to dedicated art branch only
        if: github.ref == 'refs/heads/art/r16-character-factory'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/factory/references/generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "art: preserve reconstructed original PNG and GIF reference library"
          git push origin HEAD:refs/heads/art/r16-character-factory
