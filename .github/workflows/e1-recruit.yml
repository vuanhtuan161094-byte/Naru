name: E1-E4 product smoke and runtime review
on:
  push:
    branches: [product/e-gacha-growth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and verify actual transaction
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          mkdir -p evidence
          "$G" --headless --editor --path . --import --quit >evidence/import.log 2>&1
          ! grep -E 'Parse Error|SCRIPT ERROR' evidence/import.log
          timeout 90 "$G" --headless --path . --script res://game/e1_recruit_test.gd 2>&1 | tee evidence/recruit.log
          grep NARU_E1_RECRUIT_PASS evidence/recruit.log
          ! grep -E 'SCRIPT ERROR|E1_FAIL' evidence/recruit.log
      - name: Player journey read-only and real gates
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          timeout 90 "$G" --headless --path . --script res://game/e2_journey_test.gd 2>&1 | tee evidence/journey.log
          grep NARU_E2_JOURNEY_PASS evidence/journey.log
          ! grep -E 'SCRIPT ERROR|E2_FAIL' evidence/journey.log
      - name: Paired combat movement and ultimate fixture
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          timeout 120 "$G" --headless --path . --script res://game/e3_combat_test.gd 2>&1 | tee evidence/combat.log
          grep NARU_E3_COMBAT_PASS evidence/combat.log
          ! grep -E 'SCRIPT ERROR|E3_FAIL' evidence/combat.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: E1-E2-PRODUCT-EVIDENCE
          path: evidence/

  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build reusable baked effect atlas library and 1152 routes
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 art/external/vfx_factory_fast.py --out assets/external_review/vfx
          mkdir -p evidence
          cp assets/external_review/vfx/FACTORY_REPORT.json evidence/
          printf '%s\n' "$GITHUB_SHA" > evidence/BUILD_SHA.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: E3-SHARED-VFX-LIBRARY
          path: assets/external_review/vfx/
          retention-days: 14
          if-no-files-found: warn
      - name: Embed anime VFX into local game review (no raw premium asset pack upload)
        run: |
          python3 art/vfx/premium_flipbooks.py --out assets/external_review/vfx
          cp assets/external_review/vfx/PREMIUM_REPORT.json evidence/
      - name: Prepare real Godot renderer
        run: |
          python3 tools/assemble_public_art.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth ffmpeg libgl1-mesa-dri
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Godot native V4 6v6 capture
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path . --editor --import --quit >evidence/import.log 2>&1
          ! grep -E 'Parse Error|SCRIPT ERROR' evidence/import.log
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            "$1" --path . --resolution 1280x720 --position 0,0 -- --combat-video --private-capture >evidence/runtime.log 2>&1 &
            PID=$!
            trap "kill $PID 2>/dev/null || true" EXIT
            for i in $(seq 1 45); do
              if grep -q NARU_VIDEO_BATTLE evidence/runtime.log; then break; fi
              kill -0 "$PID"; sleep 1
            done
            grep NARU_VIDEO_BATTLE evidence/runtime.log
            ffmpeg -hide_banner -loglevel error -y -f x11grab -video_size 1280x720 -framerate 20 -i "$DISPLAY" -t 24 -c:v libx264 -preset veryfast -pix_fmt yuv420p evidence/Combat-VFX-FAST.mp4
          ' bash "$G"
          grep 'NARU_FX_FACTORY_ROUTES 1152' evidence/runtime.log
          grep 'NARU_VIDEO_BATTLE 12 actors' evidence/runtime.log
          grep -E 'NARU_EXTERNAL_FX_RUNTIME_FAMILY|NARU_PREMIUM_VFX_DRAW' evidence/runtime.log | sort -u >evidence/DRAW_COVERAGE.txt
          grep NARU_PREMIUM_VFX_DRAW evidence/runtime.log
          ! grep -E 'SCRIPT ERROR|Parse Error|NARU_FX_V4_LOAD_FAIL' evidence/runtime.log
          ffmpeg -hide_banner -loglevel error -y -ss 8 -i evidence/Combat-VFX-FAST.mp4 -frames:v 1 evidence/Combat-VFX-FAST.png
          for t in 3 12 18; do ffmpeg -hide_banner -loglevel error -y -ss "$t" -i evidence/Combat-VFX-FAST.mp4 -frames:v 1 "evidence/Combat-R3-$t.png"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: E3-GODOT-VIDEO
          path: evidence/
          retention-days: 14
          if-no-files-found: warn

  ui-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare art and Godot
        run: |
          python3 tools/assemble_public_art.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Capture actual UI
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          mkdir -p e4-evidence
          printf '%s\n' "$GITHUB_SHA" > e4-evidence/BUILD_SHA.txt
          "$G" --headless --path . --editor --import --quit >e4-evidence/import.log 2>&1
          ! grep -E 'Parse Error|SCRIPT ERROR' e4-evidence/import.log
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" "$G" --path . --resolution 1280x720 --position 0,0 -- --e4-capture >e4-evidence/runtime.log 2>&1
          grep 'E4_CAPTURE_COMPLETE 135' e4-evidence/runtime.log
          test "$(find e4-evidence -name '*.png' | wc -l)" -eq 135
          ! grep -E 'Parse Error|SCRIPT ERROR|E4_CAPTURE_FAIL' e4-evidence/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: E4-NATIVE-UI-EVIDENCE
          path: e4-evidence/
          retention-days: 14
          if-no-files-found: warn

  web-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble owner-approved public art and verify Sasuke V3
        run: |
          python3 tools/assemble_public_art.py
          echo "51859f9b5db8951bdbb57489c447f23e837eaac11423727c4458a28944c84c2f  assets/production/r13/NIN-002.json" | sha256sum -c -
      - name: Install Godot 4.4.1 and export template
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/naru-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp /tmp/naru-templates/templates/web_nothreads_release.zip "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Build public PCK with required artwork, fail closed
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          chmod +x "$G"
          sed -i '0,/custom_features=""/s//custom_features="public_art"/' export_presets.cfg
          "$G" --headless --editor --path . --import --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'Parse Error|SCRIPT ERROR' /tmp/import.log
          "$G" --headless --path . -- --smoke 2>&1 | tee /tmp/art.log
          grep 'NARU_PUBLIC_ART_READY 224' /tmp/art.log
          grep NARU_REGISTRY_OK /tmp/art.log
          grep "NARU_CHARACTER_OVERLAY_READY NIN-002" /tmp/art.log
          mkdir -p dist
          "$G" --headless --path . --export-release "Web DEV" dist/index.html 2>&1 | tee /tmp/export.log
          test -s dist/index.html
          test -s dist/index.pck
          test -s dist/index.wasm
          ! grep -E 'Parse Error|SCRIPT ERROR|Export failed' /tmp/export.log
          printf '%s\n' "$GITHUB_SHA" > dist/BUILD_SHA.txt
          printf '224\n' > dist/ART_COUNT.txt
          (cd dist && sha256sum index.* > SHA256SUMS.txt)
          touch dist/.nojekyll
      - name: Test actual Web startup and starter battle with 224 textures
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory dist >/tmp/naru-http.log 2>&1 &
          set -o pipefail
          node tests/public-web-art.cjs | tee /tmp/public-web.log
          grep NARU_SASUKE_WEB_DRAW_PASS /tmp/public-web.log
      - uses: actions/upload-artifact@v4
        with:
          name: NARU-PUBLIC-FULL-ART-QA
          path: public-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: NARU-E4-ONE-GAME-WEB-DEV
          path: dist/
          if-no-files-found: error
          retention-days: 14
