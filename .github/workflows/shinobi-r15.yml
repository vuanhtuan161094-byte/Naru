name: R15 native sprite integration review
on:
  push:
    branches: [art/r14-shinobi-library]
    paths:
      - 'art/external/shinobi_r15_pack.py'
      - 'art/external/shinobi_r14.py'
      - '.github/workflows/shinobi-r15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and export all original frame cels
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 art/external/shinobi_r14.py --out "$RUNNER_TEMP/shinobi-r15"
          python3 art/external/shinobi_r15_pack.py --root "$RUNNER_TEMP/shinobi-r15" --out "$RUNNER_TEMP/shinobi-r15/LOCAL_R15_PACK.json"
          mkdir -p r15-evidence
          cp "$RUNNER_TEMP/shinobi-r15/R14_REPORT.json" r15-evidence/
          printf '%s\n' "$GITHUB_SHA" > r15-evidence/BUILD_SHA.txt
      - name: Prepare Godot and existing game art
        run: |
          python3 tools/assemble_public_art.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth ffmpeg libgl1-mesa-dri
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Native existing 6v6 battle, optional candidate art
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path . --editor --import --quit >r15-evidence/import.log 2>&1
          ! grep -E 'Parse Error|SCRIPT ERROR' r15-evidence/import.log
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            set -euo pipefail
            "$1" --path . --resolution 1280x720 --position 0,0 -- --combat-video --private-capture "--shinobi-pack=$RUNNER_TEMP/shinobi-r15/LOCAL_R15_PACK.json" >r15-evidence/runtime.log 2>&1 &
            PID=$!
            trap "kill $PID 2>/dev/null || true" EXIT
            for i in $(seq 1 30); do
              if grep -q NARU_VIDEO_BATTLE r15-evidence/runtime.log; then break; fi
              kill -0 "$PID"; sleep 1
            done
            grep NARU_VIDEO_BATTLE r15-evidence/runtime.log
            ffmpeg -hide_banner -loglevel error -y -f x11grab -video_size 1280x720 -framerate 20 -i "$DISPLAY" -t 20 -c:v libx264 -preset veryfast -pix_fmt yuv420p r15-evidence/Combat-R15.mp4
          ' bash "$G"
          grep NARU_R15_PACK_READY r15-evidence/runtime.log
          grep 'NARU_VIDEO_BATTLE 12 actors' r15-evidence/runtime.log
          grep NARU_R15_ACTOR_DRAW r15-evidence/runtime.log | sort -u >r15-evidence/DRAW_COVERAGE.txt
          ! grep -E 'SCRIPT ERROR|Parse Error|NARU_R15_PACK_FAIL' r15-evidence/runtime.log
          ffmpeg -hide_banner -loglevel error -y -ss 5 -i r15-evidence/Combat-R15.mp4 -frames:v 1 r15-evidence/Combat-R15.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NARU-R15-NATIVE-REVIEW
          path: r15-evidence/
          retention-days: 7
          if-no-files-found: warn
