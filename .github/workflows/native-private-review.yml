name: Native private review runner
on:
  push:
    branches: [integration/one-game]
    paths:
      - '.github/workflows/native-private-review.yml'
      - 'game/review_art.gd'
      - 'game/main.gd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.4.1 runner
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot-linux.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -tq godot-linux.zip
          mkdir -p runner
          split -b 12000000 -d -a 2 godot-linux.zip runner/godot.part.
          sha256sum godot-linux.zip > runner/GODOT_SHA256SUMS.txt
      - name: Package exact source without private art
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=naru-project.tar.gz HEAD
          printf '%s\n' "$GITHUB_SHA" > BUILD_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NARU-native-runner-4.4.1
          path: runner/
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: NARU-native-project-source
          path: |
            naru-project.tar.gz
            BUILD_SHA.txt
          retention-days: 30
